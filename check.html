<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Відмітка часу</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
color:#333;
}

.container{
background:white;
padding:40px;
border-radius:20px;
width:350px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

h2{
margin-bottom:20px;
color:#333;
}

select{
width:100%;
padding:12px;
margin-bottom:20px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#667eea;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
margin-bottom:10px;
}

button:hover{
background:#5a67d8;
}

button:disabled{
background:#ccc;
cursor:not-allowed;
}

.status{
margin-top:20px;
font-size:14px;
padding:10px;
border-radius:8px;
}

.success{
color:green;
background:#e8f5e8;
}

.error{
color:red;
background:#ffe8e8;
}

.debug-info{
margin-top:20px;
font-size:12px;
color:#999;
text-align:left;
border-top:1px solid #eee;
padding-top:10px;
}

</style>
</head>
<body>

<div class="container">

<h2>Відмітити прихід</h2>
    
<select id="employee">
<option value="">Оберіть працівника</option>
<option value="Іван">Іван</option>
<option value="Марія">Марія</option>
<option value="Олег">Олег</option>
<option value="Анна">Анна</option>
<option value="Петро">Петро</option>
<option value="Олена">Олена</option>
</select>

<button onclick="markArrival()" id="checkBtn">
Відмітити прихід
</button>

<div class="status" id="status"></div>

<!-- Додамо приховану інформацію для дебагу -->
<div class="debug-info" id="debug"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const statusDiv = document.getElementById("status");
const debugDiv = document.getElementById("debug");
const button = document.getElementById("checkBtn");

// Показуємо токен для перевірки
debugDiv.innerHTML = `Токен: ${token ? token : 'відсутній'}`;

if (!token) {
    statusDiv.innerHTML = "❌ Немає доступу (відсутній token)";
    statusDiv.className = "status error";
    button.disabled = true;
}

function markArrival() {
    const employeeSelect = document.getElementById("employee");
    const employee = employeeSelect.value;

    // Перевіряємо чи вибрано працівника
    if (!employee) {
        statusDiv.innerHTML = "❌ Оберіть працівника зі списку";
        statusDiv.className = "status error";
        return;
    }

    statusDiv.innerHTML = "⏳ Отримання геолокації...";
    statusDiv.className = "status";

    if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Геолокація не підтримується браузером";
        statusDiv.className = "status error";
        return;
    }

    // Отримуємо геолокацію
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const data = {
                token: token,
                employee: employee,
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
            };

            // Показуємо що відправляємо
            console.log("Відправляю дані:", data);
            debugDiv.innerHTML = `Відправляю: ${JSON.stringify(data)}`;

            statusDiv.innerHTML = "⏳ Відправка даних...";

            // Відправляємо на сервер
            fetch("/api/check-in", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(response => {
                console.log("Відповідь сервера:", response);
                debugDiv.innerHTML += `<br>Відповідь: ${JSON.stringify(response)}`;
                
                if (response.success) {
                    statusDiv.innerHTML = "✅ " + response.message;
                    statusDiv.className = "status success";
                    button.disabled = true;
                } else {
                    statusDiv.innerHTML = "❌ " + response.message;
                    statusDiv.className = "status error";
                }
            })
            .catch(error => {
                console.error("Помилка:", error);
                statusDiv.innerHTML = "❌ Помилка з'єднання з сервером";
                statusDiv.className = "status error";
            });
        },
        (error) => {
            console.error("Помилка геолокації:", error);
            let errorMessage = "❌ Не вдалося отримати геолокацію";
            
            if (error.code === 1) {
                errorMessage = "❌ Ви заборонили доступ до геолокації. Дозвольте в налаштуваннях браузера";
            } else if (error.code === 2) {
                errorMessage = "❌ Мережева помилка. Перевірте з'єднання";
            } else if (error.code === 3) {
                errorMessage = "❌ Час очікування геолокації вичерпано";
            }
            
            statusDiv.innerHTML = errorMessage;
            statusDiv.className = "status error";
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

</script>

</body>
</html>
