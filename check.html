<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Відмітка часу</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
color:#333;
}

.container{
background:white;
padding:40px;
border-radius:20px;
width:350px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

h2{
margin-bottom:20px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#667eea;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#5a67d8;
}

.status{
margin-top:20px;
font-size:14px;
}

.success{color:green;}
.error{color:red;}

</style>
</head>
<body>

<div class="container">

<h2>Відмітити прихід</h2>

<button onclick="markArrival()" id="checkBtn">
Відмітити
</button>

<div class="status" id="status"></div>

</div>

<script>

/* ===============================
   1. Перевірка token у URL
================================ */

const params = new URLSearchParams(window.location.search)
const token = params.get("token")

const status = document.getElementById("status")
const button = document.getElementById("checkBtn")

if(!token){
status.innerHTML = "❌ Немає доступу (відсутній token)"
status.className="status error"
button.disabled = true
}

/* ===============================
   2. Функція відмітки
================================ */

function markArrival(){

status.innerHTML = "Отримання геолокації..."

if(!navigator.geolocation){
status.innerHTML = "Геолокація не підтримується"
status.className="status error"
return
}

navigator.geolocation.getCurrentPosition(position=>{

const data={
token:token,
latitude:position.coords.latitude,
longitude:position.coords.longitude,
time:new Date().toISOString()
}

/* ===============================
   3. Відправка на сервер
================================ */

fetch("/api/check-in",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
})
.then(res=>res.json())
.then(response=>{

if(response.success){
status.innerHTML="✅ Прихід зафіксовано"
status.className="status success"
button.disabled=true
}
else{
status.innerHTML="❌ "+response.message
status.className="status error"
}

})
.catch(()=>{
status.innerHTML="❌ Помилка сервера"
status.className="status error"
})

},
()=>{
status.innerHTML="❌ Не вдалося отримати геолокацію"
status.className="status error"
})

}

</script>

</body>
</html>
