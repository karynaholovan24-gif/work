<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скануйте QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }
        #qrcode {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin: 20px 0;
        }
        .time {
            font-size: 24px;
            margin: 10px 0;
            color: #fff;
        }
        .info {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Скануйте для відмітки</h1>
        <div id="qrcode"></div>
        <div class="time" id="time"></div>
        <div class="info">QR оновлюється кожні 30 секунд</div>
    </div>

    <script>
        let qr;

        function generateQR() {
            const token = Math.random().toString(36).substring(2, 10);
            
            const url = `https://work-ibj8.onrender.com/check.html?token=${token}`;
            
            console.log('🔗 Створено посилання:', url);
            
            document.getElementById("qrcode").innerHTML = "";
            
            qr = new QRCode(document.getElementById("qrcode"), {
                text: url,
                width: 250,
                height: 250
            });
        }

        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerHTML = now.toLocaleTimeString();
        }

        generateQR();
        updateTime();
        setInterval(generateQR, 30000);
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
